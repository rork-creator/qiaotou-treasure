<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>化身小偷大作戰：橋頭百年秘寶</title><style>*{box-sizing:border-box}body{margin:0;background:#101b22;color:#fff1cf;font-family:system-ui,'Noto Sans TC',sans-serif}main{max-width:1000px;min-height:100vh;margin:auto;padding:20px;background:radial-gradient(ellipse at top,#38535a,#101b22 75%)}h1{font-size:clamp(30px,6vw,52px)}h2{font-size:clamp(22px,4vw,32px)}p{line-height:1.7}.panel{background:#1b3039;border:2px solid #7b6740;border-radius:22px;padding:clamp(18px,4vw,36px);margin-top:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.hero{font-size:clamp(65px,14vw,120px);text-align:center;padding:20px}.choices,.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}button{background:#e9b95b;color:#1b2527;border:0;border-radius:13px;padding:15px 20px;font-size:19px;font-weight:700;cursor:pointer;touch-action:manipulation;min-height:54px}button.secondary{background:#35545c;color:#fff1cf;border:1px solid #a58d5c}button.done{background:#57765d;color:white}.choice{display:block;text-align:left}.choice span{font-size:32px;display:block}.small{font-size:14px;margin-top:8px;font-weight:400}.item{background:#243c44;border:1px solid #536b6b;border-radius:12px;padding:14px;opacity:.6}.item.on{opacity:1;border-color:#f5c86c}.scene{font-size:70px;text-align:center;padding:25px;background:#2a454c;border-radius:15px}.feedback{color:#ffcf82;min-height:25px;font-weight:700}.progress{height:9px;background:#263e44;border-radius:10px;margin:15px 0;overflow:hidden}.progress div{height:100%;background:#e9b95b}.shadowbox{height:190px;display:grid;place-items:center;background:#344e53;border-radius:15px}.shadow{font-size:95px;transition:transform .1s}.footer{text-align:center;opacity:.7;font-size:13px;margin:25px}input[type=range]{width:100%;height:35px}input[type=text]{font-size:30px;max-width:220px;width:100%;text-align:center;padding:12px;border-radius:12px;border:2px solid #e9b95b}#app{min-height:70vh}</style></head><body><main><div id="app"><h1>🕵️ 化身小偷大作戰</h1><p>遊戲載入中……</p></div></main><script>
'use strict';
const app=document.getElementById('app');
let completed=[];try{const saved=JSON.parse(localStorage.getItem('bridgeDone')||'[]');if(Array.isArray(saved))completed=saved.filter(n=>Number.isInteger(n)&&n>=0&&n<4)}catch(e){}
const state={page:'intro',role:'',done:completed,stage:0,step:0,angle:0,feedback:''};
const levels=[['🌾','老農夫','甘蔗田與舊鐵道','黃金甘蔗鑰匙'],['⚙️','老工匠','聖觀音像','齒輪核心'],['🏯','時空旅人','日式廠長宿舍','百年時光地圖'],['🎨','藝術小偷','白屋與紅磚水塔','萬花筒之眼']];
function save(){try{localStorage.setItem('bridgeDone',JSON.stringify(state.done))}catch(e){}}
function btn(label,action,cls=''){return `<button class="${cls}" onclick="${action}">${label}</button>`}
function shell(body){app.innerHTML=`<div class="top"><strong>🕵️ 橋頭百年秘寶</strong><span>${state.done.length}/4 核心部件</span></div><div class="progress"><div style="width:${state.done.length*25}%"></div></div>${body}<div class="footer">iPad Safari 觸控版 · 數學題目為教學情境假設</div>`}
function render(){const p=state.page;
if(p==='intro'){shell(`<div class="panel" style="text-align:center"><div class="hero">🗺️🏭🔐</div><h1>化身小偷大作戰</h1><h2>橋頭百年秘寶</h2><p>神祕藏寶圖現身橋頭！尋找四位守護者，找回被時間藏起來的四段記憶。</p>${btn('開始尋寶 →',"go('roles')")}</div>`);return}
if(p==='roles'){shell(`<div class="panel"><h2>選擇你的神偷身分</h2><div class="choices">${[['🦊','疾風怪盜'],['🐈','暗夜靈貓'],['🦉','智慧幻影'],['🦝','機關高手']].map(x=>`<button class="choice" onclick="pickRole('${x[1]}')"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div></div>`);return}
if(p==='map'){shell(`<div class="panel"><h2>🗺️ 神祕藏寶地圖</h2><p>神偷 ${state.role||'探險家'}，集齊四大核心部件！</p><div class="choices">${levels.map((x,i)=>`<button class="choice ${state.done.includes(i)?'done':'secondary'}" onclick="start(${i})"><span>${x[0]}</span>${x[2]}<div class="small">${state.done.includes(i)?'✓ 已取得部件':x[1]+' · 點擊挑戰'}</div></button>`).join('')}</div><h3>🎒 神偷背包</h3><div class="items">${levels.map((x,i)=>`<div class="item ${state.done.includes(i)?'on':''}">${state.done.includes(i)?x[0]:'🔒'} ${x[3]}</div>`).join('')}</div>${state.done.length===4?btn('🔐 前往百年寶箱',"go('final')"):'<p>四件部件集齊後，開啟最終寶箱。</p>'} ${btn('重新開始',"reset()",'secondary')}</div>`);return}
if(p==='level'){level();return}
if(p==='final'){final();return}
if(p==='win'){shell(`<div class="panel" style="text-align:center"><div class="hero">🪞✨</div><h1>真正的寶藏，是你！</h1><p>恭喜神偷 ${state.role}！你偷走的不是財富，而是橋頭珍貴的歷史記憶。</p><p>從甘蔗農業、機械製糖，到百年建築與當代藝術，橋頭的文化生命力已成為你心中的寶藏。</p>${btn('返回藏寶地圖',"go('map')")} ${btn('重新挑戰','reset()','secondary')}</div>`)}
}
function go(p){state.page=p;state.feedback='';render()}
function pickRole(r){state.role=r;go('map')}
function start(i){state.stage=i;state.step=0;state.angle=0;state.feedback='';go('level')}
function wrong(msg='再想想看，觀察提示！'){state.feedback=msg;render()}
function next(){state.step=1;state.feedback='';render()}
function complete(){const i=state.stage;if(!state.done.includes(i))state.done.push(i);save();state.page='reward';shell(`<div class="panel" style="text-align:center"><div class="hero">${levels[i][0]}✨</div><h1>挑戰成功！</h1><h2>獲得【${levels[i][3]}】</h2><p>${['大地與汗水的恩賜','工業技術的傳承','歷史文化的交融','創新與未來的希望'][i]}</p>${btn('收進背包，返回地圖',"go('map')")}</div>`)}
function level(){const i=state.stage,x=levels[i];let body='';
if(i===0){body=`<p>老農夫：「綠色黃金是什麼？破解運輸算式！」</p><div class="scene">🌾🚂</div>`;if(state.step===0)body+=`<h3>哪一種作物是製糖的重要原料？</h3><div class="choices">${btn('🌽 玉米','wrong()','secondary')}${btn('🎋 甘蔗','next()','secondary')}${btn('🥬 青菜','wrong()','secondary')}</div>`;else body+=`<h3>假設每節車廂載 8 噸甘蔗，6 節共載幾噸？</h3><div class="choices">${[36,48,56].map(n=>btn(n+' 噸',n===48?'complete()':'wrong()','secondary')).join('')}</div>`}
if(i===1){body=`<p>老工匠：「相鄰的齒輪轉動方向相反。第一個順時針，第三個呢？」</p><div class="scene">⚙️ ⚙️ ⚙️</div><h3>第三個齒輪的旋轉方向</h3><div class="choices">${btn('↻ 順時針','complete()','secondary')}${btn('↺ 逆時針',"wrong('相鄰齒輪反向，請依序推理。')",'secondary')}</div>`}
if(i===2){body=`<p>時空旅人：「仔細觀察日式建築，找出文化與生活痕跡。」</p><div class="scene">🏯🌳</div>`;if(state.step===0)body+=`<h3>哪個特色常見於傳統日式木造建築？</h3><div class="choices">${btn('木構架與深出簷屋頂','next()','secondary')}${btn('玻璃帷幕摩天大樓','wrong()','secondary')}${btn('鋼鐵貨櫃堆疊','wrong()','secondary')}</div>`;else body+=`<h3>橋頭糖廠創建於哪一年？</h3><div class="choices">${[1901,1950,2001].map(n=>btn(n+' 年',n===1901?'complete()':'wrong()','secondary')).join('')}</div>`}
if(i===3){body=`<p>藝術小偷：「轉動光源角度，讓舊鐵件的影子變成一把鑰匙！」</p><div class="shadowbox"><div class="shadow" id="shadow" style="transform:rotate(${state.angle-90}deg)">🗝️</div></div><h3>滑動光影角度，讓鑰匙正立（90°）</h3><input aria-label="光影角度" type="range" min="0" max="180" step="15" value="${state.angle}" oninput="angleUpdate(this.value)"><p>目前角度：<span id="angleLabel">${state.angle}</span>°</p>${btn('確認光影機關','checkAngle()')}`}
shell(`<div class="panel"><div class="top"><span>第 ${i+1} 關 · ${x[2]}</span>${btn('← 地圖',"go('map')",'secondary')}</div><h2>${x[0]} ${x[1]}</h2>${body}<div class="feedback">${state.feedback}</div></div>`)}
function angleUpdate(v){state.angle=Number(v);document.getElementById('shadow').style.transform=`rotate(${state.angle-90}deg)`;document.getElementById('angleLabel').textContent=v}
function checkAngle(){if(state.angle===90)complete();else wrong('請將光影角度調整為 90°。')}
function final(){if(state.done.length!==4){go('map');return}const tokens=[['🌾',1],['⚙️',9],['🏯',0],['🎨',1]];shell(`<div class="panel" style="text-align:center"><div class="hero">🔐</div><h1>百年寶箱</h1><p>依照四個關卡順序，輸入核心部件上的數字。</p><div class="items">${tokens.map(x=>`<div class="item on">${x[0]} ${x[1]}</div>`).join('')}</div><p><input id="code" inputmode="numeric" maxlength="4" type="text" placeholder="••••" aria-label="四位數密碼"></p>${btn('開啟寶箱','checkCode()')}<div class="feedback" id="codeFeedback"></div><p class="small">提示：密碼與橋頭糖廠創建年份有關。</p>${btn('返回地圖',"go('map')",'secondary')}</div>`)}
function checkCode(){if(document.getElementById('code').value.trim()==='1901')go('win');else document.getElementById('codeFeedback').textContent='密碼不正確！請依序查看四件部件。'}
function reset(){if(!confirm('確定清除闖關紀錄？'))return;state.done=[];save();state.role='';go('intro')}
render();
</script></body></html>
